<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Cute purple elephant matching cc.png style -->
  
  <!-- Body -->
  <ellipse cx="16" cy="22" rx="9" ry="6" fill="#E8DEF8" stroke="#9575CD" stroke-width="0.8"/>
  
  <!-- Back legs -->
  <rect x="9" y="24" width="4" height="5" rx="2" fill="#E8DEF8" stroke="#9575CD" stroke-width="0.6"/>
  <rect x="19" y="24" width="4" height="5" rx="2" fill="#E8DEF8" stroke="#9575CD" stroke-width="0.6"/>
  
  <!-- Head - big and round -->
  <circle cx="16" cy="12" r="9" fill="#E8DEF8" stroke="#9575CD" stroke-width="0.8"/>
  
  <!-- Ears -->
  <ellipse cx="6" cy="10" rx="4" ry="5" fill="#9575CD"/>
  <ellipse cx="6" cy="10" rx="2.5" ry="3.5" fill="#E8DEF8"/>
  <ellipse cx="26" cy="10" rx="4" ry="5" fill="#9575CD"/>
  <ellipse cx="26" cy="10" rx="2.5" ry="3.5" fill="#E8DEF8"/>
  
  <!-- Trunk - cute curled -->
  <path d="M 16 15 Q 16 19 14 20 Q 12 21 13 19 Q 14 17 14 15" fill="#E8DEF8" stroke="#9575CD" stroke-width="0.8"/>
  
  <!-- Eyes - big kawaii style -->
  <circle cx="12" cy="10" r="2.5" fill="white"/>
  <circle cx="20" cy="10" r="2.5" fill="white"/>
  <circle cx="12.5" cy="10.5" r="1.5" fill="#4A148C"/>
  <circle cx="20.5" cy="10.5" r="1.5" fill="#4A148C"/>
  <circle cx="12" cy="9.5" r="0.6" fill="white"/>
  <circle cx="20" cy="9.5" r="0.6" fill="white"/>
  
  <!-- Eyebrows -->
  <path d="M 10 7 Q 12 6.5 14 7" stroke="#9575CD" stroke-width="0.5" fill="none"/>
  <path d="M 18 7 Q 20 6.5 22 7" stroke="#9575CD" stroke-width="0.5" fill="none"/>
  
  <!-- Rosy cheeks -->
  <circle cx="8" cy="13" r="1.5" fill="#F8BBD9" opacity="0.7"/>
  <circle cx="24" cy="13" r="1.5" fill="#F8BBD9" opacity="0.7"/>
  
  <!-- Tail with puff -->
  <path d="M 25 20 Q 28 18 27 15" stroke="#9575CD" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <circle cx="27" cy="14" r="1.5" fill="#9575CD"/>
</svg>

